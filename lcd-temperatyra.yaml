esphome:
  name: twst
  friendly_name: twst

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    encryption:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_u
      password: !secret wifi_password_u
    - ssid: !secret wifi_ssid_k
      password: !secret wifi_password_k

  ap:
    ssid: NTC_LCD
    password: !secret ap_password
    
  manual_ip:
    static_ip: 192.168.0.47
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
    dns2: 8.8.8.8

captive_portal:
web_server:

i2c:
  sda: GPIO21
  scl: GPIO22

time:
  - platform: sntp
    id: my_time
    timezone: "EET-2EEST,M3.5.0/3,M10.5.0/4"



display:
  - platform: lcd_pcf8574
    dimensions: 20x4
    address: 0x27
    id: lcd_screen
    update_interval: 1s
    lambda: |-
      static uint32_t ip_received_time = 0;
      static bool was_connected = false;

      // --- 1. КРИТИЧНИЙ ЗАХИСТ: Перевірка перегріву котла (Пріоритет №1) ---
      if (id(boiler_overheat).state) {
        if ((millis() / 1000) % 2 == 0) {
          it.print(0, 0, "!!!!!!!!!!!!!!!!!!!!");
          it.print(0, 1, "!!  CRITICAL ERROR!!");
          it.printf(0, 2, "!! OVERHEAT: %4.1fC !!", id(boiler_supply).state);
          it.print(0, 3, "!!!!!!!!!!!!!!!!!!!!");
        } else {
          it.print(0, 0, "                    ");
          it.print(0, 1, "    BOILER HOT!     ");
          it.printf(0, 2, "     TEMP: %4.1fC   ", id(boiler_supply).state);
          it.print(0, 3, "                    ");
        }
        return; 
      }

      // --- 2. Стандартна логіка відображення ---
      if (wifi::global_wifi_component->is_connected()) {
        if (!was_connected) {
          ip_received_time = millis(); 
          was_connected = true;
        }

        if (millis() - ip_received_time < 5000) {
          it.print(0, 0, "WiFi Connected!     ");
          it.print(0, 1, "IP Address:         ");
          if (id(wifi_ip).has_state()) {
            it.printf(0, 2, "%-20s", id(wifi_ip).state.c_str());
          } else {
            it.print(0, 2, "Getting IP...       ");
          }
          it.print(0, 3, "                    ");
        } 
        else {
          // --- Оптимізований робочий екран 20x4 ---
          auto current_time = id(my_time).now();
          
          if (current_time.is_valid()) {
            // Чергування Часу та Дати кожні 5 секунд у рядку 0 (символи 0-14)
            if ((millis() / 5000) % 2 == 0) {
              it.strftime(0, 0, "Time: %H:%M:%S ", current_time);
            } else {
              it.strftime(0, 0, "Date: %d-%m-%y ", current_time);
            }
          } else {
            it.print(0, 0, "Syncing...     ");
          }

          // Рівень Wi-Fi у верхньому правому кутку (символи 15-20)
          if (id(wifi_signal_db).has_state()) {
            int pct = min(max(2 * (int(id(wifi_signal_db).state) + 100), 0), 100);
            it.printf(15, 0, "W:%3d%%", pct);
          } else {
            it.print(15, 0, "W:---%");
          }

          // Рядок 1: Подача котла
          it.print(0, 1, "Podacha:     ");
          if (id(boiler_supply).has_state() && !std::isnan(id(boiler_supply).state)) {
            it.printf(13, 1, "%4.1f C", id(boiler_supply).state);
          } else {
            it.print(13, 1, "--- C ");
          }

          // Рядок 2: Обратка котла
          it.print(0, 2, "Obratka:     ");
          if (id(boiler_sensor_or).has_state() && !std::isnan(id(boiler_sensor_or).state)) {
            it.printf(13, 2, "%4.1f C", id(boiler_sensor_or).state);
          } else {
            it.print(13, 2, "--- C ");
          }

          // Рядок 3: Температура котельні
          it.print(0, 3, "Kotelna:     ");
          if (id(boiler_room).has_state() && !std::isnan(id(boiler_room).state)) {
            it.printf(13, 3, "%4.1f C", id(boiler_room).state);
          } else {
            it.print(13, 3, "--- C ");
          }
        }
      }
      else if (wifi::global_wifi_component->is_ap_active()) {
        it.print(0, 0, "WiFi: Failed!       ");
        it.print(0, 1, "Hotspot AP Active   ");
        it.print(0, 2, "IP: 192.168.4.1     ");
        it.print(0, 3, "                    ");
        was_connected = false; 
      }
      else {
        it.print(0, 0, "Booting...          ");
        it.print(0, 1, "Connecting to WiFi. ");
        it.print(0, 2, "Please wait...      ");
        it.print(0, 3, "                    ");
        was_connected = false;
      }


one_wire:
  - platform: gpio
    pin: GPIO25
    id: bus_boiler
  - platform: gpio
    pin: GPIO18
    id: hub_1wire_room

    
sensor:
  #- platform: dallas_temp
  #  one_wire_id: bus_boiler
  #  #index: 0 
  #  address: 0x2400000025ee8328
  #  unit_of_measurement: "°C"
  #  name: "Котел Подача"
  #  id: boiler_supply
  #  resolution: 12  
  #  update_interval: 10s
  #  filters:
  #    - calibrate_linear:
  #        datapoints:
  #          - 0.2 -> 0.0
  #          - 18.0 -> 20.0
  #          - 38.4 -> 40.0
  #          - 58.6 -> 60.0
  #          - 78.5 -> 80.0
  #          - 99.6 -> 99.8
  #        method: exact

  - platform: dallas_temp
    one_wire_id: bus_boiler
    address: 0x2400000025ee8328
    unit_of_measurement: "°C"
    name: "Котел Подача"
    id: boiler_supply
    resolution: 12  
    update_interval: 10s
    filters:
      - filter_out: 85.0
      - filter_out: -127.0
      - lambda: |-
          if (x < -10.0 || x > 115.0) return {};
          return x;
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.2 -> 0.0
            - 19.0 -> 20.0
            - 38.4 -> 40.0
            - 58.6 -> 60.0
            - 78.5 -> 80.0
            - 99.6 -> 99.8
      # Если 45 секунд нет валидных данных — переводим в Unavailable (NaN)
      - timeout: 45s

  - platform: dallas_temp
    one_wire_id: bus_boiler
    address: 0xd51abf00874d3728
    unit_of_measurement: "°C"
    name: "Котел Обратка"
    id: boiler_sensor_or
    update_interval: 10s  
    resolution: 12
    filters:
      - filter_out: 85.0
      - filter_out: -127.0
      - lambda: |-
          if (x < -10.0 || x > 115.0) return {};
          return x;
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.8 -> 0.0
            - 17.2 -> 20.0
            - 38.1 -> 40.0
            - 58.4 -> 60.0
            - 78.8 -> 80.0
            - 98.6 -> 99.8
      - timeout: 45s

  - platform: dallas_temp
    one_wire_id: hub_1wire_room
    address: 0xc53eae0087e75628
    unit_of_measurement: "°C"
    name: "В помещении"
    id: boiler_room
    update_interval: 10s 
    resolution: 12
    filters:
      - filter_out: 85.0
      - filter_out: -127.0
      - lambda: |-
          if (x < -20.0 || x > 60.0) return {};
          return x;
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.2 -> 0.0
            - 18.3 -> 20.0
            - 38.8 -> 40.0
      - timeout: 45s

 
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    
  - platform: uptime
    id: uptime_seconds
    
button:    
  - platform: restart
    name: "Restart"  
    
binary_sensor:
  - platform: status
    name: "Online"

  - platform: template
    name: "Перегрев Котла Авария"
    id: boiler_overheat
    device_class: problem
    lambda: |-
      static bool alarm_state = false;
      if (id(boiler_supply).has_state() && !std::isnan(id(boiler_supply).state)) {
        float temp = id(boiler_supply).state;
        if (temp >= 84.5) {
          alarm_state = true;
        } else if (temp <= 81.5) {
          alarm_state = false;
        }
      }
      return alarm_state;


text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: wifi_ip
      icon: "mdi:alert"
    ssid:
      name: SSID
      id: my_ssid
      icon: "mdi:access-point"
  - platform: version
    name: "Version"
    hide_timestamp: true
    hide_hash: true
  - platform: uptime
    name: Uptime
    format:
      separator: " "
      days: D
      hours: h
      minutes: m
